name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Si se sube otro commit a la misma rama, cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Análisis de código (ruff + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Versiones fijas para que el resultado sea reproducible
      - name: Instalar herramientas
        run: pip install "ruff==0.17.6" "bandit==1.9.4"

      # Solo se analizan las carpetas que existen (así no falla si todavía no hay tests/ o scripts/)
      - name: Ruff (estilo, errores e imports)
        run: |
          paths=$(ls -d api src scripts tests 2>/dev/null | tr '\n' ' ')
          echo "Analizando: $paths"
          ruff check $paths --select E,F,I,UP --line-length 110

      - name: Bandit (seguridad, severidad media o alta)
        run: bandit -q -r api src -ll

  test:
    name: Pruebas (pytest)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:api            # para importar `traductor` y `main` sin instalar el paquete
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing     # credenciales falsas: las pruebas usan AWS simulado
      AWS_SECRET_ACCESS_KEY: testing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: python -m pytest -q

  frontend:
    name: Frontend (ESLint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar código
        run: npm run lint

      - name: Construir frontend
        run: npm run build

      - name: Publicar build del frontend
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  terraform:
    name: Validar Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Formato
        run: terraform fmt -check -recursive

      # No necesita credenciales de AWS ni toca la infraestructura real.
      - name: Inicializar (sin backend)
        run: terraform init -backend=false -input=false

      - name: Validar
        run: terraform validate

  deliver-model:
    name: Entregar artefacto validado de SageMaker
    needs: [lint, test, frontend, terraform]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empaquetar modelo
        run: |
          mkdir -p "$RUNNER_TEMP/model-package/code"
          cp sagemaker/model/language_clf.joblib "$RUNNER_TEMP/model-package/"
          cp sagemaker/code/inference.py "$RUNNER_TEMP/model-package/code/"
          cp sagemaker/code/requirements.txt "$RUNNER_TEMP/model-package/code/"
          tar -czf "$RUNNER_TEMP/model.tar.gz" -C "$RUNNER_TEMP/model-package" .

      - name: Validar estructura del paquete
        run: |
          tar -tzf "$RUNNER_TEMP/model.tar.gz" > "$RUNNER_TEMP/model-contents.txt"
          grep -Fxq './language_clf.joblib' "$RUNNER_TEMP/model-contents.txt"
          grep -Fxq './code/inference.py' "$RUNNER_TEMP/model-contents.txt"
          grep -Fxq './code/requirements.txt' "$RUNNER_TEMP/model-contents.txt"

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sagemaker-model-${{ github.sha }}
          path: ${{ runner.temp }}/model.tar.gz
          if-no-files-found: error
          retention-days: 14
